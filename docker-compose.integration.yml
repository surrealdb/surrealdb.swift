services:
  surrealdb:
    image: surrealdb/surrealdb:${SURREALDB_IMAGE_TAG:-v3.3.4}
    command: start --log info --user ${SURREALDB_USER:-root} --pass ${SURREALDB_PASSWORD:-root} memory
    environment:
      # Files (`DEFINE BUCKET`, `f"..."`) are experimental; the file tests need them.
      SURREAL_CAPS_ALLOW_EXPERIMENTAL: files
    ports:
      - "${SURREALDB_PORT:-8000}:8000"
